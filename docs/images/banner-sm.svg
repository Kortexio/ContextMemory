<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Kortexio ContextMemory</title>
  <desc id="desc">Memory you can open as a wiki</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F8FA"/>
      <stop offset="100%" stop-color="#EEF6F5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <!-- soft wiki pages -->
  <g opacity="0.35" fill="none" stroke="#0D9488" stroke-width="2">
    <rect x="180" y="110" width="160" height="200" rx="10" fill="#fff" stroke-opacity="0.45"/>
    <rect x="210" y="140" width="100" height="8" rx="4" fill="#99F6E4" stroke="none"/>
    <rect x="210" y="164" width="120" height="6" rx="3" fill="#CCFBF1" stroke="none"/>
    <rect x="210" y="184" width="90" height="6" rx="3" fill="#CCFBF1" stroke="none"/>
    <rect x="210" y="204" width="110" height="6" rx="3" fill="#CCFBF1" stroke="none"/>
    <rect x="1260" y="130" width="160" height="200" rx="10" fill="#fff" stroke-opacity="0.45"/>
    <rect x="1290" y="160" width="100" height="8" rx="4" fill="#99F6E4" stroke="none"/>
    <rect x="1290" y="184" width="120" height="6" rx="3" fill="#CCFBF1" stroke="none"/>
    <rect x="1290" y="204" width="80" height="6" rx="3" fill="#CCFBF1" stroke="none"/>
    <rect x="1290" y="224" width="105" height="6" rx="3" fill="#CCFBF1" stroke="none"/>
  </g>
  <!-- nodes -->
  <g fill="#14B8A6" opacity="0.25">
    <circle cx="400" cy="90" r="6"/>
    <circle cx="1180" cy="380" r="5"/>
    <circle cx="320" cy="360" r="4"/>
    <circle cx="1280" cy="80" r="5"/>
  </g>
  <text x="800" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#0F172A">Kortexio</text>
  <text x="800" y="265" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="url(#accent)">ContextMemory</text>
  <text x="800" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#64748B">Memory you can open as a wiki</text>
  <rect x="700" y="350" width="200" height="4" rx="2" fill="url(#accent)" opacity="0.7"/>
</svg>
