name: bench-selftest

# Protocol honesty for the adversarial suite (no live LLM).

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - ".github/workflows/bench-selftest.yml"
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/bench-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bench selftest
        run: node benchmarks/bench.mjs selftest
