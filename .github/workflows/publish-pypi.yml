name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'Kortexio/ContextMemory'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpers/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN not set — skipping PyPI publish."
            exit 0
          fi
          python -m pip install --upgrade build twine
          python -m build
          # Soft-fail: duplicate version / token issues must not fail the release.
          python -m twine upload dist/* || {
            echo "::warning::PyPI upload failed (check PYPI_API_TOKEN / version). Continuing."
            exit 0
          }
