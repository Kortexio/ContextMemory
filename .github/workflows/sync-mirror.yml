name: Sync mirror

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve peer repository
        id: peer
        run: |
          case "${{ github.repository }}" in
            Kortexio/ContextMemory)
              echo "peer=vitorcastro78/ContextMemory" >> "$GITHUB_OUTPUT"
              ;;
            vitorcastro78/ContextMemory)
              echo "peer=Kortexio/ContextMemory" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown repository ${{ github.repository }}; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout
        if: steps.peer.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Avoid persisting GITHUB_TOKEN in http.*.extraheader — it overrides
          # any PAT embedded in a remote URL and causes 403 as the source org/bot.
          persist-credentials: false

      - name: Mirror to peer
        if: steps.peer.outputs.skip != 'true'
        env:
          PEER_TOKEN: ${{ secrets.PEER_SYNC_TOKEN }}
          PEER_REPO: ${{ steps.peer.outputs.peer }}
        run: |
          set -euo pipefail
          if [ -z "${PEER_TOKEN:-}" ]; then
            echo "PEER_SYNC_TOKEN is not set; skipping mirror."
            exit 0
          fi

          # Show which account the secret authenticates as (no token leakage).
          TOKEN_USER="$(curl -sS -H "Authorization: Bearer ${PEER_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user | jq -r '.login // empty')"
          echo "PEER_SYNC_TOKEN identity: ${TOKEN_USER:-unknown-or-not-a-user-token}"

          # Strip any leftover Authorization headers from checkout / runner config.
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git config --local --unset-all http.extraheader || true

          # Prefer Authorization header with PEER_TOKEN over URL-embedded creds.
          BASIC="$(printf 'x-access-token:%s' "${PEER_TOKEN}" | base64 -w 0)"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${BASIC}"

          git remote remove peer 2>/dev/null || true
          git remote add peer "https://github.com/${PEER_REPO}.git"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git push peer --all
            git push peer --tags
            exit 0
          fi

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            git push peer "${{ github.ref }}"
          else
            git push peer "HEAD:${{ github.ref_name }}"
          fi
