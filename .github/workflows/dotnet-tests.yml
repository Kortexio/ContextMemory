name: dotnet-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore ContextMemory.sln
      - name: Test
        run: dotnet test tests/ContextMemory.Api.Tests/ContextMemory.Api.Tests.csproj --no-restore --verbosity minimal
