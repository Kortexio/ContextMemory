name: content-cadence

# Suggests a short social hook (manual approve via issue).
# Does not auto-publish to social — safer for brand voice.

on:
  schedule:
    - cron: "0 14 * * 2" # Tuesday 14:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - name: Open hook suggestion issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOOKS=(
            "Your coding agent forgets staging DB names. Fix that in five minutes."
            "What was true last March? — bi-temporal wiki, not a vector blob."
            "Same chat URL for memory and shell/python/node."
            "Destructive tool? HITL pauses until you confirm."
            "Not RAG. On-demand wiki_search inside the agent loop."
            "Skills and guardrails as editable packs — not prompt spaghetti."
            "Ollama today, vLLM tomorrow — same gateway, per-app config."
            "Admin Playground: watch tool steps and HITL without a client."
          )
          HOOK="${HOOKS[$RANDOM % ${#HOOKS[@]}]}"
          BODY=$(printf '%s\n\n%s\n\n%s\n' \
            "## Suggested post" \
            "$HOOK" \
            "Copy to LinkedIn/X after editing. Do **not** call this RAG. CTA: https://github.com/Kortexio/ContextMemory")
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Content cadence: social hook suggestion" \
            --label "content-hook" \
            --body "$BODY" || \
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Content cadence: social hook suggestion" \
            --body "$BODY"
